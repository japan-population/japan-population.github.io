name: Update statistics
on:
  schedule:
    - cron: '0 9 20,22,24,26,28,30 * *' # 18:00 JST, every other day from the 20th
    - cron: '0 9 5 10 *' # Regional statistics: October 5, 18:00 JST
  workflow_dispatch:
    inputs:
      scope:
        description: '更新対象（all は過去統計・将来推計も含む手動の全体更新）'
        type: choice
        required: true
        default: monthly
        options:
          - monthly
          - regional
          - all
permissions:
  contents: read
concurrency:
  group: update-statistics
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: plan
        run: node scripts/update-schedule.mjs
        env:
          UPDATE_EVENT: ${{ github.event_name }}
          UPDATE_SCOPE: ${{ inputs.scope }}
          UPDATE_SCHEDULE: ${{ github.event.schedule }}
  update:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/vital
          key: vital-csv-v1-${{ github.run_id }}
          restore-keys: vital-csv-v1-
      - run: npm test
      - name: Fetch, normalize, model and validate before replacing JSON
        run: npm run update-data
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          UPDATE_SCOPE: ${{ needs.plan.outputs.scope }}
          UPDATE_EVENT: ${{ github.event_name }}
      - run: npm run validate-data
      - run: npm run build
      - name: Prepare JSON-only handoff
        run: node scripts/data-update-artifact.mjs pack "$RUNNER_TEMP/data-handoff/data-update.json" "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        id: handoff
        with:
          name: statistics-update-${{ github.run_attempt }}
          path: ${{ runner.temp }}/data-handoff/data-update.json
          if-no-files-found: error
          retention-days: 1
  commit:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.update.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/data-handoff
      - name: Apply data without executing artifact code
        run: node scripts/data-update-artifact.mjs apply "$RUNNER_TEMP/data-handoff/data-update.json" "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.sha }}
      - name: Commit changed data
        id: commit
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=false
          if [ -n "$(git status --porcelain -- public/data)" ]; then changed=true; fi
          if [ -z "$(git status --porcelain -- public/data .github/data-update-state.json)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data .github/data-update-state.json
          git commit -m 'data: update official statistics and forecasts'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # A concurrent branch change causes a normal non-fast-forward rejection.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:$TARGET_BRANCH"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: commit
    if: needs.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.commit.outputs.ref }}
