name: Update statistics
on:
  schedule:
    - cron: '0 9 20,22,24,26,28,30 * *' # 18:00 JST, every other day from the 20th
    - cron: '0 9 5 10 *' # Regional statistics: October 5, 18:00 JST
  workflow_dispatch:
    inputs:
      scope:
        description: '更新対象（all は過去統計・将来推計も含む手動の全体更新）'
        type: choice
        required: true
        default: monthly
        options:
          - monthly
          - regional
          - all
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update-statistics
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - id: plan
        run: node scripts/update-schedule.mjs
        env:
          UPDATE_EVENT: ${{ github.event_name }}
          UPDATE_SCOPE: ${{ inputs.scope }}
          UPDATE_SCHEDULE: ${{ github.event.schedule }}
  update:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/vital
          key: vital-csv-v1-${{ github.run_id }}
          restore-keys: vital-csv-v1-
      - run: npm test
      - name: Fetch, normalize, model and validate before replacing JSON
        run: npm run update-data
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          UPDATE_SCOPE: ${{ needs.plan.outputs.scope }}
          UPDATE_EVENT: ${{ github.event_name }}
      - run: npm run validate-data
      - run: npm run build
      - name: Commit changed data
        id: commit
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          changed=false
          if [ -n "$(git status --porcelain -- public/data)" ]; then changed=true; fi
          if [ -z "$(git status --porcelain -- public/data .github/data-update-state.json)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data .github/data-update-state.json
          git commit -m 'data: update official statistics and forecasts'
          git push origin "HEAD:$TARGET_BRANCH"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update.outputs.ref }}
